/* =====================================================
   API
===================================================== */

const API_URL =

"https://script.google.com/macros/s/AKfycbxbgyIg_ddBYIs8qkQvRN3xS3-ZG451C5y_2sNbVFWdWydzb9Mc6qV5CoWB5rjs91ghjQ/exec";


/* =====================================================
   USERNAME
===================================================== */

const username =

(
    localStorage.getItem("username")
    || ""
).trim();


/* =====================================================
   INITIAL LOCAL DATA
===================================================== */

const localName =

localStorage.getItem("name")
|| "User";

const localRole =

localStorage.getItem("role")
|| "User";

const localStatus =

localStorage.getItem("status")
|| "Active";


setBasicData({

    username:username,

    name:localName,

    role:localRole,

    status:localStatus

});


/* =====================================================
   LOAD ACCOUNT
===================================================== */

loadAccount();


async function loadAccount(){

    if(!username){

        return;

    }

    try{

        const url =

        API_URL
        +
        "?action=getaccount"
        +
        "&username="
        +
        encodeURIComponent(username);


        const response =

        await fetch(

            url,

            {
                method:"GET",
                cache:"no-store"
            }

        );


        const data =

        await response.json();


        if(data.success === true){

            displayUser(
                data.user
            );

        }

        else{

            console.error(
                data.message
            );

        }

    }

    catch(error){

        console.error(
            "Account Error:",
            error
        );

    }

}


/* =====================================================
   BASIC DATA
===================================================== */

function setBasicData(user){

    const name =
    user.name || "User";

    const userName =
    user.username || username || "-";

    const role =
    user.role || "User";

    const status =
    user.status || "Active";


    document.getElementById(
        "sidebarName"
    ).textContent = name;


    document.getElementById(
        "sidebarRole"
    ).textContent = role;


    document.getElementById(
        "topName"
    ).textContent = name;


    document.getElementById(
        "topRole"
    ).textContent = role;


    document.getElementById(
        "profileName"
    ).textContent = name;


    document.getElementById(
        "profileUsername"
    ).textContent =
    "@" + userName;


    document.getElementById(
        "profileRole"
    ).textContent = role;


    document.getElementById(
        "profileStatus"
    ).textContent = status;


    document.getElementById(
        "accountName"
    ).textContent = name;


    document.getElementById(
        "accountUsername"
    ).textContent = userName;


    const initial =

    name
    .trim()
    .charAt(0)
    .toUpperCase()
    || "U";


    document.getElementById(
        "sidebarAvatar"
    ).textContent = initial;


    document.getElementById(
        "topAvatar"
    ).textContent = initial;


    document.getElementById(
        "defaultPhoto"
    ).textContent = initial;

}


/* =====================================================
   DISPLAY USER
===================================================== */

function displayUser(user){

    setBasicData(user);


    /* ================================
       PASSWORD
    ================================= */

    const password =

    String(
        user.password || ""
    );


    const passwordElement =

    document.getElementById(
        "accountPassword"
    );


    passwordElement.dataset.password =
    password;


    passwordElement.textContent =
    "••••••••";


    document.getElementById(
        "passwordToggle"
    ).textContent =
    "Show";


    /* ================================
       DEPARTMENT
    ================================= */

    document.getElementById(
        "accountDepartment"
    ).textContent =

    user.department || "-";


    /* ================================
       JOIN DATE
    ================================= */

    document.getElementById(
        "accountJoinDate"
    ).textContent =

    user.joinDate || "-";


    /* ================================
       BLOOD GROUP
    ================================= */

    document.getElementById(
        "accountBloodGroup"
    ).textContent =

    user.bloodGroup || "-";


    /* ================================
       PHOTO
    ================================= */

    const photo =

    String(
        user.photo || ""
    ).trim();


    const image =

    document.getElementById(
        "profilePhoto"
    );


    const defaultPhoto =

    document.getElementById(
        "defaultPhoto"
    );


    if(photo){

        image.src = photo;

        image.style.display =
        "block";

        defaultPhoto.style.display =
        "none";


        image.onerror = function(){

            image.style.display =
            "none";

            defaultPhoto.style.display =
            "flex";

        };

    }

    else{

        image.style.display =
        "none";

        defaultPhoto.style.display =
        "flex";

    }


    /* ================================
       PROFESSIONS
    ================================= */

    const professions = [

        {
            name:user.profession1,
            logo:user.professionCompanyLG1
        },

        {
            name:user.profession2,
            logo:user.professionCompanyLG2
        },

        {
            name:user.profession3,
            logo:user.professionCompanyLG3
        },

        {
            name:user.profession4,
            logo:user.professionCompanyLG4
        },

        {
            name:user.profession5,
            logo:user.professionCompanyLG5
        },

        {
            name:user.profession6,
            logo:user.professionCompanyLG6
        }

    ];


    renderProfessions(
        professions
    );

}


/* =====================================================
   RENDER PROFESSIONS
===================================================== */

function renderProfessions(professions){

    const list =

    document.getElementById(
        "professionList"
    );


    const section =

    document.getElementById(
        "professionSection"
    );


    list.innerHTML = "";


    let count = 0;


    professions.forEach(function(item){

        const name =

        String(
            item.name || ""
        ).trim();


        const logo =

        String(
            item.logo || ""
        ).trim();


        /* EMPTY PROFESSION HIDDEN */

        if(!name){

            return;

        }


        count++;


        const card =

        document.createElement(
            "div"
        );

        card.className =
        "profession-card";


        const left =

        document.createElement(
            "div"
        );

        left.className =
        "profession-left";


        const number =

        document.createElement(
            "div"
        );

        number.className =
        "profession-number";

        number.textContent =
        count;


        const text =

        document.createElement(
            "div"
        );


        const label =

        document.createElement(
            "div"
        );

        label.className =
        "profession-label";

        label.textContent =
        "Profession";


        const value =

        document.createElement(
            "div"
        );

        value.className =
        "profession-value";

        value.textContent =
        name;


        text.appendChild(label);

        text.appendChild(value);


        left.appendChild(number);

        left.appendChild(text);


        card.appendChild(left);


        /* COMPANY LOGO */

        if(logo){

            const logoWrap =

            document.createElement(
                "div"
            );

            logoWrap.className =
            "company-logo-wrap";


            const logoImage =

            document.createElement(
                "img"
            );

            logoImage.className =
            "company-logo";

            logoImage.src =
            logo;

            logoImage.alt =
            "Company Logo";


            logoImage.onerror =
            function(){

                logoWrap.style.display =
                "none";

            };


            logoWrap.appendChild(
                logoImage
            );


            card.appendChild(
                logoWrap
            );

        }


        list.appendChild(
            card
        );

    });


    /* NO PROFESSION = HIDE WHOLE SECTION */

    if(count === 0){

        section.style.display =
        "none";

    }

    else{

        section.style.display =
        "block";

    }

}


/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

document.getElementById(
    "passwordToggle"
).addEventListener(

    "click",

    function(){

        const passwordElement =

        document.getElementById(
            "accountPassword"
        );


        const password =

        passwordElement.dataset.password
        || "";


        const isHidden =

        passwordElement.textContent
        ===
        "••••••••";


        if(isHidden){

            passwordElement.textContent =

            password
            ||
            "No Password";


            this.textContent =
            "Hide";

        }

        else{

            passwordElement.textContent =
            "••••••••";


            this.textContent =
            "Show";

        }

    }

);


/* =====================================================
   MOBILE SIDEBAR
===================================================== */

const sidebar =

document.getElementById(
    "sidebar"
);


const overlay =

document.getElementById(
    "sidebarOverlay"
);


document.getElementById(
    "mobileMenuBtn"
).addEventListener(

    "click",

    function(){

        sidebar.classList.add(
            "open"
        );

        overlay.classList.add(
            "show"
        );

    }

);


overlay.addEventListener(

    "click",

    function(){

        sidebar.classList.remove(
            "open"
        );

        overlay.classList.remove(
            "show"
        );

    }

);


/* =====================================================
   LOGOUT
===================================================== */

document.getElementById(
    "logoutBtn"
).addEventListener(

    "click",

    function(){

        localStorage.removeItem(
            "loggedIn"
        );

        localStorage.removeItem(
            "username"
        );

        localStorage.removeItem(
            "name"
        );

        localStorage.removeItem(
            "role"
        );

        localStorage.removeItem(
            "status"
        );


        window.location.replace(
            "login.html"
        );

    }

);
