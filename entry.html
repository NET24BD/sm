<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#07110d">

<title>New Entry | SYSTEM MANAGEMENT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

/* =====================================================
   ROOT
===================================================== */

:root{

    --bg:#07110d;

    --card:#0d1914;

    --card2:#101f18;

    --border:#1b3027;

    --green:#00c878;

    --green2:#00a866;

    --text:#e9f5ef;

    --muted:#82968c;

}


/* =====================================================
   RESET
===================================================== */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


body{

    font-family:"Inter",sans-serif;

    min-height:100vh;

    color:var(--text);

    background:

    radial-gradient(
        circle at 80% 0%,
        rgba(0,200,120,.10),
        transparent 32%
    ),

    radial-gradient(
        circle at 0% 100%,
        rgba(0,200,120,.05),
        transparent 30%
    ),

    var(--bg);

}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{

    height:75px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 30px;

    background:

    rgba(5,10,8,.90);

    border-bottom:1px solid var(--border);

    backdrop-filter:blur(15px);

}


.brand{

    display:flex;

    align-items:center;

    gap:12px;

}


.logo{

    width:42px;

    height:42px;

    border-radius:12px;

    background:

    linear-gradient(
        135deg,
        #00d982,
        #007d50
    );

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:

    0 0 25px
    rgba(0,200,120,.22);

}


.logo i{

    color:white;

    font-size:17px;

}


.brand h2{

    font-size:15px;

    font-weight:800;

    color:white;

}


.brand span{

    display:block;

    font-size:8px;

    color:var(--green);

    letter-spacing:2px;

    margin-top:4px;

}


.back-btn{

    text-decoration:none;

    color:#9aaca3;

    border:1px solid var(--border);

    background:var(--card);

    padding:10px 15px;

    border-radius:9px;

    font-size:10px;

    font-weight:600;

    transition:.2s;

}


.back-btn:hover{

    color:white;

    border-color:var(--green);

    background:

    rgba(0,200,120,.08);

}


/* =====================================================
   MAIN
===================================================== */

.main{

    min-height:

    calc(100vh - 75px);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:35px 20px;

}


/* =====================================================
   FORM CARD
===================================================== */

.form-card{

    width:100%;

    max-width:620px;

    background:

    linear-gradient(
        145deg,
        rgba(16,31,24,.98),
        rgba(9,20,15,.98)
    );

    border:1px solid var(--border);

    border-radius:22px;

    padding:32px;

    box-shadow:

    0 25px 70px
    rgba(0,0,0,.35);

    position:relative;

    overflow:hidden;

}


.form-card::before{

    content:"";

    position:absolute;

    width:220px;

    height:220px;

    right:-90px;

    top:-100px;

    border-radius:50%;

    background:

    radial-gradient(
        circle,
        rgba(0,200,120,.15),
        transparent 65%
    );

}


/* =====================================================
   HEADER
===================================================== */

.form-header{

    position:relative;

    z-index:1;

    margin-bottom:28px;

}


.form-icon{

    width:50px;

    height:50px;

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

    rgba(0,200,120,.10);

    border:1px solid
    rgba(0,200,120,.18);

    color:var(--green);

    font-size:20px;

    margin-bottom:17px;

}


.form-header h1{

    font-size:24px;

    font-weight:800;

    color:white;

}


.form-header h1 span{

    color:var(--green);

}


.form-header p{

    color:var(--muted);

    font-size:10px;

    line-height:1.7;

    margin-top:7px;

}


/* =====================================================
   FORM
===================================================== */

.form-group{

    margin-bottom:18px;

}


.form-group label{

    display:block;

    font-size:10px;

    font-weight:700;

    color:#b9c8c0;

    margin-bottom:8px;

}


.input-box{

    position:relative;

}


.input-box i{

    position:absolute;

    left:14px;

    top:50%;

    transform:translateY(-50%);

    color:#60766b;

    font-size:12px;

}


input,
textarea{

    width:100%;

    border:1px solid var(--border);

    background:#08130e;

    color:white;

    outline:none;

    border-radius:10px;

    font-family:inherit;

    font-size:11px;

    transition:.2s;

}


input{

    height:46px;

    padding:0 14px 0 42px;

}


textarea{

    min-height:110px;

    padding:14px;

    resize:vertical;

}


input::placeholder,
textarea::placeholder{

    color:#52655b;

}


input:focus,
textarea:focus{

    border-color:

    rgba(0,200,120,.55);

    box-shadow:

    0 0 0 3px
    rgba(0,200,120,.07);

}


/* =====================================================
   TWO COLUMN
===================================================== */

.row{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:15px;

}


/* =====================================================
   SUBMIT
===================================================== */

.submit-btn{

    width:100%;

    height:48px;

    border:none;

    border-radius:10px;

    margin-top:7px;

    background:

    linear-gradient(
        135deg,
        #00d982,
        #00a866
    );

    color:white;

    font-family:inherit;

    font-size:11px;

    font-weight:800;

    cursor:pointer;

    box-shadow:

    0 10px 25px
    rgba(0,200,120,.15);

    transition:.25s;

}


.submit-btn:hover{

    transform:translateY(-2px);

    box-shadow:

    0 14px 30px
    rgba(0,200,120,.25);

}


.submit-btn:active{

    transform:translateY(0);

}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:9px;

    font-size:10px;

    text-align:center;

}


.message.show{

    display:block;

}


.message.success{

    color:#00d982;

    background:
    rgba(0,200,120,.08);

    border:1px solid
    rgba(0,200,120,.15);

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    text-align:center;

    color:#4f6258;

    font-size:8px;

    margin-top:22px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .topbar{

        padding:0 15px;

    }

    .brand h2{

        font-size:13px;

    }

    .brand span{

        font-size:7px;

    }

    .back-btn{

        padding:9px 11px;

    }

    .main{

        padding:20px 14px;

        align-items:flex-start;

    }

    .form-card{

        padding:23px 18px;

        border-radius:18px;

    }

    .form-header h1{

        font-size:21px;

    }

    .row{

        grid-template-columns:1fr;

        gap:0;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     TOP BAR
===================================================== -->

<header class="topbar">


<div class="brand">


<div class="logo">

<i class="fa-solid fa-layer-group"></i>

</div>


<div>

<h2>SYSTEM MANAGEMENT</h2>

<span>CALL ENTRY SYSTEM</span>

</div>


</div>


<a href="dashboard.html"
class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

&nbsp; Back

</a>


</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


<div>


<div class="form-card">


<div class="form-header">


<div class="form-icon">

<i class="fa-solid fa-phone-volume"></i>

</div>


<h1>

New <span>Entry</span>

</h1>


<p>

Enter customer information and problem details
to create a new support or call entry.

</p>


</div>



<form id="entryForm">


<!-- IP + NUMBER -->

<div class="row">


<div class="form-group">


<label>

IP / Customer ID

</label>


<div class="input-box">


<i class="fa-solid fa-id-card"></i>


<input

type="text"

id="ip"

placeholder="Enter IP or Customer ID"

required

>

</div>


</div>



<div class="form-group">


<label>

Phone Number

</label>


<div class="input-box">


<i class="fa-solid fa-phone"></i>


<input

type="tel"

id="number"

placeholder="Enter phone number"

required

>

</div>


</div>


</div>



<!-- PROBLEM -->

<div class="form-group">


<label>

Problem

</label>


<textarea

id="problem"

placeholder="Describe the customer problem..."

required

></textarea>


</div>



<!-- REFERENCE -->

<div class="form-group">


<label>

Reference

</label>


<div class="input-box">


<i class="fa-solid fa-link"></i>


<input

type="text"

id="reference"

placeholder="Enter reference"

>

</div>


</div>



<!-- SUBMIT -->

<button

type="submit"

class="submit-btn"

>

<i class="fa-solid fa-paper-plane"></i>

&nbsp;&nbsp;

Submit Entry

</button>


<div

id="message"

class="message"

>

Entry submitted successfully.

</div>


</form>


</div>


<div class="footer">

SYSTEM MANAGEMENT • Professional Operations Platform

</div>


</div>


</main>



<script>

/* =====================================================
   FORM SUBMIT
   CURRENTLY NO GOOGLE SHEET CONNECTION
===================================================== */

document
.getElementById("entryForm")
.addEventListener(
"submit",
function(event){

    event.preventDefault();


    const ip =

    document
    .getElementById("ip")
    .value
    .trim();


    const number =

    document
    .getElementById("number")
    .value
    .trim();


    const problem =

    document
    .getElementById("problem")
    .value
    .trim();


    const reference =

    document
    .getElementById("reference")
    .value
    .trim();


    if(

        !ip ||

        !number ||

        !problem

    ){

        return;

    }


    /*
       GOOGLE SHEET CONNECT
       WILL BE ADDED LATER
    */


    const message =

    document
    .getElementById("message");


    message
    .className =
    "message show success";


    message.innerHTML =

    '<i class="fa-solid fa-circle-check"></i>' +

    '&nbsp; Entry submitted successfully.';


    document
    .getElementById("entryForm")
    .reset();


    setTimeout(

        function(){

            message
            .classList
            .remove("show");

        },

        3000

    );

});

</script>


</body>

</html>
