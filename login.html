<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#07111f">

<title>Login | System Menagment</title>


<style>

/* ================================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* ================================
   BODY
================================ */

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    background:

    radial-gradient(
        circle at 10% 10%,
        rgba(0,200,120,0.18),
        transparent 32%
    ),

    radial-gradient(
        circle at 90% 90%,
        rgba(0,130,255,0.18),
        transparent 32%
    ),

    #07111f;

}


/* ================================
   LOGIN CARD
================================ */

.login-card{

    width:100%;

    max-width:420px;

    padding:40px 32px;

    background:
    rgba(10,25,40,0.96);

    border:
    1px solid
    rgba(255,255,255,0.10);

    border-radius:24px;

    box-shadow:
    0 25px 70px
    rgba(0,0,0,0.55);

}


/* ================================
   LOGO
================================ */

.logo{

    width:75px;

    height:75px;

    margin:
    0 auto 20px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:20px;

    background:
    linear-gradient(
        135deg,
        #00c878,
        #0099ff
    );

    color:white;

    font-size:24px;

    font-weight:bold;

    letter-spacing:1px;

}


/* ================================
   TITLE
================================ */

h1{

    text-align:center;

    color:white;

    font-size:27px;

    margin-bottom:8px;

}


.subtitle{

    text-align:center;

    color:#8fa4b7;

    font-size:14px;

    margin-bottom:30px;

}


/* ================================
   INPUT GROUP
================================ */

.input-group{

    margin-bottom:20px;

}


.input-group label{

    display:block;

    color:#cbd6df;

    font-size:14px;

    font-weight:600;

    margin-bottom:8px;

}


.input-group input{

    width:100%;

    height:52px;

    padding:
    0 15px;

    border:
    1px solid
    #263c4f;

    border-radius:12px;

    outline:none;

    background:#0b1b2a;

    color:white;

    font-size:15px;

}


.input-group input::placeholder{

    color:#607487;

}


.input-group input:focus{

    border-color:#00c878;

    box-shadow:
    0 0 0 3px
    rgba(0,200,120,0.10);

}


/* ================================
   LOGIN BUTTON
================================ */

.login-btn{

    width:100%;

    height:52px;

    border:none;

    border-radius:12px;

    background:
    linear-gradient(
        135deg,
        #00c878,
        #0099ff
    );

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

}


.login-btn:hover{

    transform:
    translateY(-2px);

    box-shadow:
    0 12px 30px
    rgba(0,200,150,0.25);

}


.login-btn:disabled{

    opacity:0.6;

    cursor:not-allowed;

}


/* ================================
   MESSAGE
================================ */

.message{

    display:none;

    margin-top:18px;

    padding:12px;

    border-radius:10px;

    text-align:center;

    font-size:13px;

}


.message.error{

    display:block;

    color:#ff7777;

    background:
    rgba(255,50,50,0.08);

    border:
    1px solid
    rgba(255,50,50,0.25);

}


.message.success{

    display:block;

    color:#4dffae;

    background:
    rgba(0,200,120,0.08);

    border:
    1px solid
    rgba(0,200,120,0.25);

}


/* ================================
   LOADING
================================ */

.loading{

    display:none;

}


.footer{

    margin-top:25px;

    text-align:center;

    color:#607487;

    font-size:12px;

}


@media(max-width:480px){

    .login-card{

        padding:
        32px 22px;

    }

}

</style>

</head>


<body>


<div class="login-card">


<!-- LOGO -->

<div class="logo">

    SM

</div>


<h1>

    Welcome Back

</h1>


<div class="subtitle">

    Sign in to System Menagment

</div>


<!-- LOGIN FORM -->

<form id="loginForm">


<div class="input-group">

<label for="username">

Username

</label>

<input

type="text"

id="username"

placeholder="Enter username"

autocomplete="username"

required

>

</div>


<div class="input-group">

<label for="password">

Password

</label>

<input

type="password"

id="password"

placeholder="Enter password"

autocomplete="current-password"

required

>

</div>


<button

type="submit"

id="loginBtn"

class="login-btn"

>

<span id="btnText">

LOGIN

</span>

<span id="loadingText" class="loading">

Checking...

</span>

</button>


</form>


<!-- MESSAGE -->

<div

id="message"

class="message"

></div>


<div class="footer">

© 2026 System Menagment

</div>


</div>



<script>


/* =================================================
   GOOGLE APPS SCRIPT URL
================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxbgyIg_ddBYIs8qkQvRN3xS3-ZG451C5y_2sNbVFWdWydzb9Mc6qV5CoWB5rjs91ghjQ/exec";



/* =================================================
   ROLE REDIRECT
================================================= */

const ROLE_REDIRECT = {

    "admin":
    "admin.html",

    "support":
    "support.html",

    "call":
    "call.html",

    "manager":
    "manager.html",

    "guest support":
    "guest-support.html",

    "guest admin":
    "guest-admin.html"

};



/* =================================================
   GET ELEMENTS
================================================= */

const loginForm =
document.getElementById(
    "loginForm"
);


const loginBtn =
document.getElementById(
    "loginBtn"
);


const btnText =
document.getElementById(
    "btnText"
);


const loadingText =
document.getElementById(
    "loadingText"
);


const message =
document.getElementById(
    "message"
);



/* =================================================
   LOGIN
================================================= */

loginForm.addEventListener(

"submit",

async function(event){

    event.preventDefault();


    /* ---------------------------------------------
       GET USERNAME
    --------------------------------------------- */

    const username =

    document
    .getElementById("username")
    .value
    .trim();


    /* ---------------------------------------------
       GET PASSWORD
    --------------------------------------------- */

    const password =

    document
    .getElementById("password")
    .value
    .trim();


    /* ---------------------------------------------
       CLEAR MESSAGE
    --------------------------------------------- */

    message.className =
    "message";

    message.innerText =
    "";


    /* ---------------------------------------------
       VALIDATION
    --------------------------------------------- */

    if(
        username === "" ||
        password === ""
    ){

        showMessage(

            "Please enter username and password.",

            "error"

        );

        return;

    }


    /* ---------------------------------------------
       LOADING
    --------------------------------------------- */

    loginBtn.disabled =
    true;

    btnText.style.display =
    "none";

    loadingText.style.display =
    "inline";


    try{


        /* -----------------------------------------
           CREATE URL
        ------------------------------------------ */

        const loginURL =

        API_URL +

        "?action=login" +

        "&username=" +

        encodeURIComponent(
            username
        ) +

        "&password=" +

        encodeURIComponent(
            password
        );


        /* -----------------------------------------
           SEND REQUEST
        ------------------------------------------ */

        const response =

        await fetch(

            loginURL,

            {

                method:"GET",

                cache:"no-store"

            }

        );


        /* -----------------------------------------
           GET RESPONSE
        ------------------------------------------ */

        const data =

        await response.json();


        /* -----------------------------------------
           SUCCESS
        ------------------------------------------ */

        if(
            data.success === true
        ){


            /* GET ROLE */

            const role =

            String(
                data.role || ""
            )
            .trim()
            .toLowerCase();


            /* FIND FILE */

            const redirectFile =

            ROLE_REDIRECT[
                role
            ];


            /* ROLE NOT FOUND */

            if(
                !redirectFile
            ){

                showMessage(

                    "Role not configured: " +
                    role,

                    "error"

                );

                resetLogin();

                return;

            }


            /* -------------------------------------
               SAVE LOGIN DATA
            -------------------------------------- */

            localStorage.setItem(
                "loggedIn",
                "true"
            );


            localStorage.setItem(
                "username",
                data.username || username
            );


            localStorage.setItem(
                "name",
                data.name || ""
            );


            localStorage.setItem(
                "role",
                role
            );


            localStorage.setItem(
                "status",
                data.status || "Active"
            );


            /* -------------------------------------
               SUCCESS MESSAGE
            -------------------------------------- */

            showMessage(

                "Login successful. Redirecting...",

                "success"

            );


            /* -------------------------------------
               REDIRECT
            -------------------------------------- */

            setTimeout(

            function(){

                window.location.href =
                redirectFile;

            },

            700

            );


        }

        else{


            /* -------------------------------------
               LOGIN FAILED
            -------------------------------------- */

            showMessage(

                data.message ||

                "Invalid username or password.",

                "error"

            );


            resetLogin();

        }


    }

    catch(error){


        console.error(
            error
        );


        showMessage(

            "Server connection failed. Please try again.",

            "error"

        );


        resetLogin();

    }

}

);



/* =================================================
   SHOW MESSAGE
================================================= */

function showMessage(

    text,

    type

){

    message.innerText =
    text;

    message.className =

    "message " +
    type;

}



/* =================================================
   RESET LOGIN BUTTON
================================================= */

function resetLogin(){

    loginBtn.disabled =
    false;

    btnText.style.display =
    "inline";

    loadingText.style.display =
    "none";

}


</script>


</body>

</html>
